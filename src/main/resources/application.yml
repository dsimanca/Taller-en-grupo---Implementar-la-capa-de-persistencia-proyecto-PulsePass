spring:
  application:
    name: pulsepass
  datasource:
    url: ${PULSEPASS_DB_URL:jdbc:postgresql://localhost:5432/pulsepass}
    username: ${PULSEPASS_DB_USERNAME:pulsepass}
    password: ${PULSEPASS_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate          # ¡CRÍTICO! Solo valida, nunca crea/modifica
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

# Fase 4 - Capa de Seguridad
# SEC-004: la clave JJWT se lee exclusivamente del entorno. Nunca hardcodear un secreto real.
# Generar con: openssl rand -base64 32  (o equivalente)
pulsepass:
  security:
    jwt:
      issuer: ${PULSEPASS_JWT_ISSUER:pulsepass-api}
      secret-base64: ${PULSEPASS_JWT_SECRET_BASE64}
      access-token-ttl: ${PULSEPASS_JWT_ACCESS_TOKEN_TTL:PT15M}
    cors:
      allowed-origins: ${PULSEPASS_CORS_ALLOWED_ORIGINS:http://localhost:4200}
