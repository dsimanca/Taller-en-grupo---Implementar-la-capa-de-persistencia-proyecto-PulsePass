spring:
  application:
    name: pulsepass
  datasource:
    url: jdbc:postgresql://localhost:5432/pulsepass
    username: pulsepass
    password: ${PULSEPASS_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate          # ¡CRÍTICO! Solo valida, nunca crea/modifica
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
pulsepass:
  security:
    jwt:
      issuer: ${PULSEPASS_JWT_ISSUER:pulsepass-api}
      secret-base64: ${PULSEPASS_JWT_SECRET_BASE64:}
      expiration: ${PULSEPASS_JWT_ACCESS_TOKEN_TTL:PT15M}
    cors:
      allowed-origins: ${PULSEPASS_CORS_ALLOWED_ORIGINS:}